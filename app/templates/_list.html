{% from "_macros.html" import portion_picker %}
<section id="item-list">
  <div class="sort-toggle" role="group" aria-label="Sort by">
    <button type="button" class="sort-btn{{ ' active' if sort == 'frozen' else '' }}"
      hx-get="/items?sort=frozen" hx-target="#item-list" hx-swap="outerHTML">Oldest first</button>
    <button type="button" class="sort-btn{{ ' active' if sort == 'portions' else '' }}"
      hx-get="/items?sort=portions" hx-target="#item-list" hx-swap="outerHTML">Most portions</button>
  </div>

  {% if error %}
  <p class="error" role="alert">{{ error }}</p>
  {% endif %}

  {% if items %}
  <ul class="items">
    {% for item in items %}
      {% include "_item.html" %}
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">Nothing in the freezer yet &mdash; add your first batch above.</p>
  {% endif %}
</section>
