{% extends "base.html" %}
{% from "_macros.html" import portion_picker %}
{% block body %}
<main class="page">
  <h1>🧊 FreezerBags</h1>

  <form class="add-form" hx-post="/items?sort={{ sort }}" hx-target="#item-list" hx-swap="outerHTML" data-reset-on-success>
    <input type="text" name="name" placeholder="What did you cook?" maxlength="80" required autocomplete="off">
    <div class="add-row" hidden>
      {{ portion_picker('add-portions', start=4) }}
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>

  {% include "_list.html" %}
</main>
{% endblock %}
