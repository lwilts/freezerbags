{% macro portion_picker(field_id, name='portions', start=1, max=99) %}
{# Shared portion selector used by the add form and the eat/add-to dialogs. #}
<div class="portion-picker" data-portion-picker data-max="{{ max }}">
  <input type="hidden" name="{{ name }}" id="{{ field_id }}" value="{{ start }}" min="1" max="{{ max }}">
  <div class="portion-steps" role="group" aria-label="Number of portions">
    {% for n in range(1, 7) %}
    <button type="button" class="portion-step" data-set="{{ n }}">{{ n }}</button>
    {% endfor %}
  </div>
  <div class="portion-custom">
    <button type="button" class="portion-adjust" data-adjust="-1" aria-label="Fewer portions">&minus;</button>
    <output class="portion-value">{{ start }}</output>
    <button type="button" class="portion-adjust" data-adjust="1" aria-label="More portions">&plus;</button>
  </div>
</div>
{% endmacro %}
