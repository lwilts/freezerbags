apiVersion: v1
kind: Namespace
metadata:
  name: freezerbags
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freezerbags-data
  namespace: freezerbags
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freezerbags
  namespace: freezerbags
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freezerbags
  template:
    metadata:
      labels:
        app: freezerbags
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: freezerbags
        image: ghcr.io/lwilts/freezerbags:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATA_DIR
          value: /data
        - name: TZ
          value: "Europe/London"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: freezerbags-data
---
apiVersion: v1
kind: Service
metadata:
  name: freezerbags
  namespace: freezerbags
spec:
  selector:
    app: freezerbags
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: freezerbags
  namespace: freezerbags
spec:
  parentRefs:
  - name: lab-gateway
    namespace: nginx-gateway
    sectionName: https
  hostnames:
  - "freezer.lab.lkwt.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: freezerbags
      port: 8000
